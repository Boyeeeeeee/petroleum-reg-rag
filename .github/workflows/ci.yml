name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway value so test_app.py can import. It protects nothing: the tests
      # that use it either expect a 401 or are deselected below.
      APP_API_KEY: ci-dummy-key
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5

      # Tests marked `groq` call the real Groq API, so CI skips them.
      - name: Run tests (no Groq calls)
        run: python -m pytest -q -rs -m "not groq"
